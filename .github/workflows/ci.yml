name: ci

on:
  push:
  pull_request:
  # Run by hand, from the Actions page: what a Mac's disk image is asked for by.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # clang's BPF target compiles the watcher (the index module's build); libbpf loads BPF objects. The runner's
      # tests run unprivileged, so the loader's end-to-end tests skip there; the rest run, the declarations against
      # the runner's own kernel included.
      # dbus-daemon runs the D-Bus tests' private buses; gdbus (libglib2.0-bin), dbus-send and busctl are the other
      # implementations they are checked against.
      - name: Install clang, libbpf and D-Bus's tools
        run: sudo apt-get update && sudo apt-get install -y clang libbpf1 dbus-daemon dbus-bin libglib2.0-bin systemd
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Draw the picker
        run: ./gradlew :picker:test -Pbrowser.screenshots=build/shots --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picker
          path: build/shots/
          if-no-files-found: ignore

  # macOS on Apple silicon (the runner's): every module compiled, its tests too, and the tests of what is macOS's own
  # run against the real system (the bindings, the desktop, the watcher), which a Linux runner cannot. The tests that
  # need Linux are not run here yet; as each part of prism stands apart from Linux, its tests join.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assemble testClasses --no-daemon
      # What is macOS's own, against the system itself; and what stands apart from any platform.
      - name: Test macOS's own
        run: ./gradlew :ffi:test :platform:test :macos:test --no-daemon

  # What is published for a Linux with no Nix: prism's jars, a Java to run them and the statically linked client, in
  # one archive, built by the flake (nix/package-portable.nix) and kept with the run.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the archive
        run: nix build .#prism-portable -L
      - uses: actions/upload-artifact@v4
        with:
          name: prism-linux-x86_64
          path: result/*.tar.gz
          if-no-files-found: error

  # What is published for a Mac with no Nix: Prism.app in a disk image, built by the flake (nix/dmg.nix), to download
  # from the run's page and pass to a Mac (docs/platform.md, "Passing it on"). It is sealed for no one in particular,
  # since there is no certificate here to sign it with. The lock of what Gradle fetches on a Mac
  # (nix/deps-darwin.json) is written again first and kept with the run, to be committed where it has changed.
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Write the lock of what Gradle fetches
        run: $(nix build .#prism.mitmCache.updateScript --print-out-paths --no-link)
      - name: Make the disk image
        run: nix build .#prism-dmg -L
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-macos-arm64
          path: |
            result/*.dmg
            nix/deps-darwin.json
          if-no-files-found: error

  # The flake: prism built as the Nix package (which fails where nix/deps.json no longer holds what Gradle fetches,
  # as after a dependency was changed without it being written again), and the NixOS module evaluated each way it
  # can be set (docs/nixos.md).
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check the flake
        run: nix flake check -L
