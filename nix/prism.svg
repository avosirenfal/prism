<?xml version="1.0" encoding="UTF-8"?>
<!--
  prism's icon, on every platform: what the Linux package installs as it is, and what tools/icons draws the Mac's
  (prism.icns), Windows' (prism.ico) and the picture (prism.png) from. Run tools/icons after changing it.

  The letter is the P of Plus Jakarta Sans ExtraBold (SIL Open Font License), as its outline, so that nothing that
  draws this needs the font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303338"/>
      <stop offset="100%" stop-color="#202328"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#399BFF"/>
      <stop offset="100%" stop-color="#1976DB"/>
    </linearGradient>
  </defs>

  <!-- The graphite tile, and the light along its upper edge. -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="url(#tile)" stroke="#555A60" stroke-width="1.5"/>
  <path d="M100 17 H412" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" fill="none"/>

  <path d="M145.3 406V106H260.4Q291.4 106 315.4 116.9Q339.4 127.7 353 149.1Q366.7 170.4 366.7 201.8Q366.7 232.4 352.8 253.8Q339 275.1 315 286.2Q291 297.3 260.4 297.3H207.7V406ZM207.7 242.9H260.8Q280.6 242.9 292.4 231.6Q304.3 220.4 304.3 201.8Q304.3 182.9 292.4 171.6Q280.6 160.4 260.8 160.4H207.7Z" fill="url(#letter)"/>
</svg>
