# The Kotlin compiler daemon compiles the modules together; Gradle's default 512 MB is tight for Compose.
org.gradle.jvmargs=-Xmx2g
kotlin.daemon.jvmargs=-Xmx3g

# Build cache: a task's outputs (compiled classes, test results, the generated and compiled probes, the lint
# report) are reused whenever its inputs are unchanged, across clean checkouts and branches.
org.gradle.caching=true
# Configuration cache: the configured task graph is reused while no build script or input changed, and the
# modules configure in parallel.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Tasks of different modules run in parallel. Both of these rely on every module being configured only by its
# own script and the build-logic conventions, never by another module's.
org.gradle.parallel=true
